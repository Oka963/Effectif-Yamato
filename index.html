<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effectif officiel des Shinigami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#060608;--panel:rgba(18,18,24,.82);--line:rgba(255,255,255,.075);--or:#ff8a2a;--gold:#ffc94d;--text:#ece8e4;--dim:#8a8590;--bleu:#6cb8ff;--violet:#b78cff;--vert:#7be08a;--rouge:#ff5d5d;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Rajdhani',sans-serif;padding:0 24px 70px;background:radial-gradient(900px 420px at 50% -8%,rgba(255,138,42,.12),transparent 65%),var(--bg);}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;}
.wrap{max-width:1400px;margin:0 auto;position:relative;z-index:1;}
.hero{position:relative;text-align:center;padding:40px 10px 26px;overflow:hidden;}
.kanji{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:'Noto Serif JP',serif;font-weight:900;font-size:230px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,138,42,.14);white-space:nowrap;user-select:none;}
.eyebrow{position:relative;font-size:12px;letter-spacing:9px;color:var(--dim);text-transform:uppercase;}
.hero h1{position:relative;margin:8px 0 0;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(34px,6vw,64px);letter-spacing:8px;background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,var(--or));-webkit-background-clip:text;background-clip:text;color:transparent;}
.gem{display:block;margin:14px auto 0;width:9px;height:9px;transform:rotate(45deg);background:var(--or);box-shadow:0 0 14px var(--or);}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:6px 0 14px;}
.stat{position:relative;overflow:hidden;padding:18px 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c);}
.stat::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.12;}
.num{font-family:'Cinzel',serif;font-size:36px;font-weight:700;color:var(--c);line-height:1;}
.lab{margin-top:9px;font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;}
.sync{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.sync b{color:var(--or);}
.track{flex:1;height:1px;background:var(--line);}
.fill{height:100%;width:0;background:var(--or);box-shadow:0 0 6px var(--or);transition:width .4s linear;}

.controls{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:11px;margin-bottom:20px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.55;}
.search{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--text);padding:14px 16px 14px 46px;border-radius:10px;font-family:'Rajdhani';font-size:16px;letter-spacing:1px;}
.search:focus{outline:none;border-color:var(--or);}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.frow.col{align-items:flex-start;}
.lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:#c06a1e;text-transform:uppercase;min-width:62px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--dim);padding:7px 14px;border-radius:30px;font-family:'Rajdhani';font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;}
.chip:hover{color:var(--text);}
.chip.on{background:rgba(255,138,42,.16);border-color:var(--or);color:var(--gold);box-shadow:0 0 12px rgba(255,138,42,.22);}

.cols,.row{display:grid;grid-template-columns:44px minmax(190px,1.4fr) 1fr .8fr 1fr .9fr .9fr 1.7fr .6fr .8fr;gap:12px;align-items:center;}
.cols{padding:0 18px 0 22px;font-size:9px;letter-spacing:3.5px;color:var(--dim);text-transform:uppercase;font-weight:700;}
.tier{margin-top:26px;}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:'Cinzel',serif;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:var(--or);}
.gh::before{content:'';width:8px;height:8px;transform:rotate(45deg);background:var(--or);box-shadow:0 0 10px var(--or);}
.gh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--or),transparent);opacity:.5;}
.gh .n{order:3;font-family:'Rajdhani';letter-spacing:1px;color:var(--dim);font-size:13px;background:rgba(255,255,255,.05);padding:2px 10px;border-radius:20px;}
.row{margin-bottom:8px;padding:12px 18px 12px 22px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--t);border-radius:12px;font-size:14px;animation:rise .45s both;}
.row:hover{background:rgba(255,138,42,.07);}
.row.abs{opacity:.6;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.idx{font-family:'Cinzel',serif;font-size:14px;color:var(--dim);}
.person{display:flex;align-items:center;gap:14px;min-width:0;}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:var(--t);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),rgba(0,0,0,.45));border:1.5px solid var(--t);box-shadow:0 0 14px -2px var(--t);}
.nom{font-weight:700;color:#fff;font-size:16px;letter-spacing:.4px;}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:.5px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 11%,transparent);color:var(--c);white-space:nowrap;}
.pill.dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);}
.stack{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.none{color:var(--dim);opacity:.45;}
.fn{font-size:13px;line-height:1.4;opacity:.88;}
.yes{color:var(--rouge);font-weight:700;font-size:12px;letter-spacing:1px;}
.sanc{color:#ff9a9a;font-weight:700;font-size:12px;}
.empty{text-align:center;padding:70px 20px;color:var(--dim);font-family:'Cinzel',serif;letter-spacing:3px;line-height:2;}
@media (max-width:1000px){
  .cols{display:none;}
  .row{grid-template-columns:36px 1fr;}
  .row>*:nth-child(n+3){grid-column:2;}
  .kanji{font-size:140px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header class="hero">
    <div class="kanji">死神</div>
    <div class="eyebrow">Effectif officiel des Shinigami</div>
    <h1>Clan Yamato</h1>
    <span class="gem"></span>
  </header>

  <section class="stats" id="stats"></section>

  <div class="sync"><span>Sync <b id="syncTime">--:--:--</b></span><div class="track"><div class="fill" id="fill"></div></div><span id="syncRight">Auto-sync <b>30s</b></span></div>

  <section class="controls">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input class="search" id="q" placeholder="Rechercher un shinigami…">
    </div>
    <div class="frow col"><span class="lbl">Grade</span><div class="chips" id="fGrade"></div></div>
    <div class="frow"><span class="lbl">Corps</span><div class="chips" id="fCorps"></div></div>
    <div class="frow"><span class="lbl">Pôle</span><div class="chips" id="fPole"></div></div>
    <div class="frow"><span class="lbl">Rôle</span><div class="chips" id="fRole"></div></div>
  </section>

  <div class="cols"><span></span><span>Shinigami</span><span>Grade</span><span>Corps</span><span>Pôle</span><span>Zanpakuto</span><span>Rôles</span><span>Fonction</span><span>Absent</span><span>Sanction</span></div>
  <div id="list"><div class="empty">Chargement de l’effectif…</div></div>
</div>

<script>
// Lecture publique du Google Sheet (partage : « Tous les utilisateurs disposant du lien : Lecteur »)
// Colonnes : Grade | Nom | Corps | Pôle | Zanpakuto | Rôle | Fonction | Absent | Sanction
const SHEET_ID = "1tnwF14f0sA2nslOD2xVVhj10yLSH2a5EqCwQ-PJb8NA", GID = 0, REFRESH_MS = 30000;

const GRADES = ["Capitaine","Fukutaicho","3ème siège","4ème siège","5ème siège","6ème siège","7ème siège","8ème siège","9ème siège","10ème siège","Junshikan 1er classe","Junshikan 2nd classe","Junshikan 3e classe","Kashikan 1er classe","Kashikan 2nd classe","Shinigami 1er","Shinigami 2nd","Shinigami 3ème"];
const TIER = ["#ffc94d","#ffa63a"]; const TIER_DEF = "#ff8a2a";
const COLORS = { spirituel:"#6cb8ff", technique:"#ff9a3c", formateur:"#b78cff", tresorerie:"#ffd36a", alchimie:"#7be08a" };
const DEMO = [
  ["Capitaine","Takemura Tokugawa","","","","Kenpachi","Le mec le plus stylé des 3 mondes · Le meilleur scientifique des 3 mondes","",""],
  ["Fukutaicho","Jotaro Yoshikage","","Formateur, Trésorerie","","","G. Pôle Trésorerie · Le deuxieme mec le plus styler des 3 mondes","",""]
];
let all = [], demo = false, timer = null;
const F = { grade:"Tous", corps:"Tous", pole:"Tous", role:"Tous" };

const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const isTrue = v => ["true","vrai","oui","x","1"].includes(norm(v));
const split = s => (s||"").split(/[,;/&+|]|\bet\b/i).map(x => x.trim()).filter(Boolean);
const initials = n => { const p = n.trim().split(/\s+/); return ((p[0]||"")[0]||"").toUpperCase() + ((p[1]||"")[0]||"").toUpperCase(); };
const gIdx = g => { const i = GRADES.findIndex(x => norm(x) === norm(g) || norm(x).replace("siege","") === norm(g).replace("siege","")); return i < 0 ? 999 : i; };
const col = v => COLORS[norm(v)] || "#ff8a2a";

function parseCSV(t){
  const rows = []; let r = [], f = "", q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i], n = t[i+1];
    if(q){ if(c === '"' && n === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ r.push(f); f = ""; }
    else if(c === '\n'){ r.push(f); rows.push(r); r = []; f = ""; }
    else if(c !== '\r') f += c;
  }
  if(f || r.length){ r.push(f); rows.push(r); }
  return rows;
}
function build(rows){
  let h = rows.findIndex(r => { const k = r.map(x => norm(String(x ?? ""))); return k.includes("grade") && k.includes("nom"); });
  let C;
  if(h < 0){ if(rows.length && rows[0].length >= 9){ h = -1; C = {grade:0,nom:1,corps:2,pole:3,zanpakuto:4,role:5,fonction:6,absent:7,sanction:8}; } else return []; }
  else {
    const k = rows[h].map(x => norm(String(x ?? ""))), find = (...m) => k.findIndex(c => m.some(x => c === x || c.startsWith(x)));
    C = { grade:find("grade"), nom:find("nom"), corps:find("corps"), pole:find("pole"), zanpakuto:find("zanpakuto"), role:find("role"), fonction:find("fonction"), absent:find("absent"), sanction:find("sanction") };
  }
  const out = [];
  for(let i=h+1;i<rows.length;i++){
    const r = rows[i], g = k => k >= 0 ? String(r[k] ?? "").trim() : "";
    const nom = g(C.nom); if(!nom) continue;
    const grade = g(C.grade);
    const s = g(C.sanction);
    out.push({ grade:grade||"Non classé", gi:gIdx(grade), nom, corps:g(C.corps), poles:split(g(C.pole)), zan:g(C.zanpakuto), roles:split(g(C.role)), fn:g(C.fonction), abs:isTrue(g(C.absent)), sanc:["","false","faux","non","aucune"].includes(s.toLowerCase()) ? "" : (isTrue(s) ? "Sanctionné" : s) });
  }
  return out.sort((a,b) => a.gi - b.gi);
}

function parseCSV(t){
  const rows = []; let r = [], f = "", q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i], n = t[i+1];
    if(q){ if(c === '"' && n === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ r.push(f); f = ""; }
    else if(c === '\n'){ r.push(f); rows.push(r); r = []; f = ""; }
    else if(c !== '\r') f += c;
  }
  if(f || r.length){ r.push(f); rows.push(r); }
  return rows;
}
async function load(){
  const list = document.getElementById("list");
  try{
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&t=${Date.now()}`, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    if(/^\s*<(!DOCTYPE|html)/i.test(txt)) throw new Error("feuille privée");
    all = build(parseCSV(txt)); demo = false;
    if(!all.length){ all = build([["Grade","Nom","Corps","Pôle","Zanpakuto","Rôle","Fonction","Absent","Sanction"], ...DEMO]); demo = true; }
    document.getElementById("syncRight").innerHTML = demo ? "Aperçu · feuille vide" : "Auto-sync <b>30s</b>";
    document.getElementById("syncTime").textContent = new Date().toLocaleTimeString("fr-FR");
    document.getElementById("fill").style.width = "100%";
    refresh();
  }catch(e){
    if(!all.length) list.innerHTML = `<div class="empty" style="color:var(--rouge)">Impossible de lire la feuille<br><span style="font-size:12px;letter-spacing:1px;font-family:Rajdhani">Partage-la en « Tous les utilisateurs disposant du lien : Lecteur » (${esc(e.message)})</span></div>`;
  }
}
function start(){ load(); setInterval(load, REFRESH_MS); }

function stat(n, label, c){ return `<div class="stat" style="--c:${c}"><div class="num">${n}</div><div class="lab">${label}</div></div>`; }
function stats(){
  const n = (f) => all.filter(f).length, has = (k, v) => m => norm(m[k]) === v;
  const pole = v => n(m => m.poles.some(p => norm(p) === v));
  document.getElementById("stats").innerHTML =
    stat(all.length,"Membres","#ff8a2a") + stat(n(has("corps","spirituel")),"Corps Spirituel",COLORS.spirituel) + stat(n(has("corps","technique")),"Corps Technique",COLORS.technique) +
    stat(pole("formateur"),"Pôle Formateur",COLORS.formateur) + stat(pole("tresorerie"),"Pôle Trésorerie",COLORS.tresorerie) + stat(pole("alchimie"),"Pôle Alchimie",COLORS.alchimie) +
    stat(n(m => m.abs),"Absents","#ff5d5d");
}
function chips(id, key, values){
  const h = document.getElementById(id); h.innerHTML = "";
  ["Tous", ...values].forEach(v => {
    const b = document.createElement("button");
    b.className = "chip" + (F[key] === v ? " on" : ""); b.textContent = v;
    b.onclick = () => { F[key] = v; refresh(); };
    h.appendChild(b);
  });
}
const uniq = a => [...new Set(a)];
function filters(){
  chips("fGrade","grade", uniq(all.map(m => m.grade)));
  chips("fCorps","corps", uniq(["Spirituel","Technique", ...all.map(m => m.corps).filter(Boolean)]));
  chips("fPole","pole", uniq(["Formateur","Trésorerie","Alchimie", ...all.flatMap(m => m.poles)]));
  chips("fRole","role", uniq(all.flatMap(m => m.roles)));
}
function row(m, i){
  const t = TIER[m.gi] || TIER_DEF;
  const d = "<span class='none'>–</span>";
  return `<article class="row${m.abs?" abs":""}" style="--t:${t};animation-delay:${Math.min(i*35,400)}ms">
    <span class="idx">${String(i+1).padStart(2,"0")}</span>
    <div class="person"><div class="av">${esc(initials(m.nom))}</div><span class="nom">${esc(m.nom)}</span></div>
    <span><span class="pill" style="--c:${t}">${esc(m.grade)}</span></span>
    <span>${m.corps ? `<span class="pill" style="--c:${col(m.corps)}">${esc(m.corps)}</span>` : d}</span>
    <span class="stack">${m.poles.length ? m.poles.map(p => `<span class="pill dot" style="--c:${col(p)}">${esc(p)}</span>`).join("") : d}</span>
    <span>${m.zan ? esc(m.zan) : d}</span>
    <span class="stack">${m.roles.length ? m.roles.map(r => `<span class="pill" style="--c:#ffc94d">${esc(r)}</span>`).join("") : d}</span>
    <span class="fn">${m.fn ? esc(m.fn) : d}</span>
    <span>${m.abs ? "<span class='yes'>Absent</span>" : d}</span>
    <span>${m.sanc ? `<span class="sanc">${esc(m.sanc)}</span>` : "<span class='none'>Aucune</span>"}</span>
  </article>`;
}
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = all.filter(m => m.nom.toLowerCase().includes(q) &&
    (F.grade === "Tous" || m.grade === F.grade) && (F.corps === "Tous" || norm(m.corps) === norm(F.corps)) &&
    (F.pole === "Tous" || m.poles.some(p => norm(p) === norm(F.pole))) && (F.role === "Tous" || m.roles.some(r => norm(r) === norm(F.role))));
  const box = document.getElementById("list");
  if(!list.length){ box.innerHTML = `<div class="empty">${all.length ? "Aucun shinigami trouvé" : "La feuille est vide"}</div>`; return; }
  let html = "", last = null, i = 0;
  list.forEach(m => {
    if(m.grade !== last){
      if(last !== null) html += "</section>";
      html += `<section class="tier"><div class="gh">${esc(m.grade)}<span class="n">${list.filter(x => x.grade === m.grade).length}</span></div>`;
      last = m.grade;
    }
    html += row(m, i++);
  });
  box.innerHTML = html + "</section>";
}
function refresh(){ stats(); filters(); render(); }

document.getElementById("q").addEventListener("input", render);

/* braises */
(function(){
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d"); let W, H, P = [];
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; }; addEventListener("resize", size); size();
  const mk = () => ({ x:Math.random()*W, y:H+Math.random()*40, r:Math.random()*2+.5, v:Math.random()*.4+.1, d:Math.random()*6.28, a:Math.random()*.5+.2, h:Math.random()<.8 ? 28 : 205 });
  for(let i=0;i<60;i++){ const p = mk(); p.y = Math.random()*H; P.push(p); }
  (function tick(){
    ctx.clearRect(0,0,W,H);
    P.forEach((p,i) => {
      p.y -= p.v; p.d += .01; p.x += Math.sin(p.d)*.3;
      if(p.y < -10){ P[i] = mk(); return; }
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`hsla(${p.h},100%,60%,${p.a})`); g.addColorStop(1,`hsla(${p.h},100%,60%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*5,0,7); ctx.fill();
    });
    requestAnimationFrame(tick);
  })();
})();
start();
</script>
</body>
</html>
